version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: kasoti-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: production_db_password
      POSTGRES_DB: quiz-app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: kasoti-backend
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://db:5432/quiz-app
      - DB_USER=postgres
      - DB_PASSWORD=production_db_password
      - JWT_SECRET=change_this_to_a_secure_long_random_string_for_production
      - SERVER_PORT=8080
      - CORS_ALLOWED_ORIGINS=*
    depends_on:
      - db
    restart: unless-stopped

  ai-proctor:
    build:
      context: ./ai-proctor
    container_name: kasoti-ai-proctor
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  postgres_data:
