# ============================================================
# Java Quiz Server - Backend Configuration
# ============================================================

spring.application.name=java-quiz-server
server.port=${SERVER_PORT:8080}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SHOW_SQL:true}

# Database Configuration (use environment variables in production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quiz-app}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1206}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT Configuration (use environment variable in production)
jwt.secret=${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckpXVFRva2VuR2VuZXJhdGlvbjEyMzQ1Njc4OTA=}
jwt.expiration=${JWT_EXPIRATION:86400000}


