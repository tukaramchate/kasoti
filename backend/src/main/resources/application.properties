# ============================================================
# Java Quiz Server - Backend Configuration
# ============================================================

spring.application.name=java-quiz-server
server.port=${SERVER_PORT:8080}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${SHOW_SQL:false}

# Database Configuration (use environment variables in production)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quiz-app}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1206}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT Configuration (MUST set JWT_SECRET env var in production)
# Dev default below override with a real secret in production via env var
jwt.secret=${JWT_SECRET:dGhpc0lzQVNlY3VyZURldmVsb3BtZW50S2V5Rm9yS2Fzb3RpQXBwMTIzNDU2Nzg5MEFCQ0RFRkdISUpLTE1OT1BRUlNUVVZXWFla}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Request size limits — bumped to 10MB to accommodate base64 webcam frame payloads
server.tomcat.max-http-form-content-size=10MB
server.tomcat.max-swallow-size=10MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Proctoring configuration ──────────────────────────────────────────────────
# Warnings before exam is terminated (override with PROCTOR_WARNING_LIMIT env var)
proctor.warning.limit=${PROCTOR_WARNING_LIMIT:3}
# URL of the Python AI detection microservice
proctor.ai.url=${PROCTOR_AI_URL:http://localhost:5000}

# Logging fixes "no logs in console" issue
logging.level.root=INFO
logging.level.com.tukaram=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
